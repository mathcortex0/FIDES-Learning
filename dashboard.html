<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — FIDES Learning</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* Page-specific: course card grid */
  .dash-wrap{margin-left:0;max-width:1160px;margin-inline:auto}
  .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .course-card{
    background:var(--surf);border:1px solid var(--border);border-radius:var(--rl);
    overflow:hidden;display:flex;flex-direction:column;transition:box-shadow var(--tr),transform var(--tr);
    box-shadow:var(--shadow-xs);
  }
  .course-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
  .course-thumb{
    height:118px;background:var(--grad-soft);color:var(--blue);display:flex;
    align-items:center;justify-content:center;
  }
  .course-thumb svg{width:34px;height:34px}
  .course-thumb img{width:100%;height:100%;object-fit:cover}
  .course-body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .course-title{font-family:var(--gs);font-weight:600;color:var(--t1);font-size:1.02rem}
  .course-desc{color:var(--t3);font-size:.83rem;line-height:1.55;flex:1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .course-card .btn{align-self:flex-start;margin-top:8px}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <a href="/dashboard.html" class="logo-wrap">
      <img src="images/fl.png" alt="FIDES Learning" class="logo-img">
      <span class="logo-text">FIDES Learning</span>
    </a>
  </div>
  <div class="header-right">
    <div><button class="icon-btn" id="notifBell" aria-label="Notifications"></button></div>
    <span class="header-name" id="headerName"></span>
    <button class="icon-btn" id="logoutBtn" title="Log out" aria-label="Log out">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</header>

<main class="main dash-wrap">
  <div class="page-head">
    <div><h2 id="welcomeMsg">Welcome</h2><div class="page-sub">Pick up where you left off</div></div>
  </div>

  <div id="coursesWrap"></div>
</main>

<footer id="siteFooter" class="site-footer"></footer>

<div id="toastRoot" class="toast-container"></div>

<script src="js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', boot);

async function boot() {
  const token = getToken();
  if (!token) { location.href = '/index.html'; return; }

  let user;
  try {
    ({ user } = await api('/user/me'));
  } catch (e) {
    clearSession();
    location.href = '/index.html';
    return;
  }

  document.getElementById('headerName').textContent = user.name;
  document.getElementById('welcomeMsg').textContent = `Welcome, ${user.name.split(' ')[0]}`;
  document.getElementById('logoutBtn').addEventListener('click', () => {
    clearSession();
    location.href = '/index.html';
  });

  initNotifBell();
  loadCourses();
}

async function loadCourses() {
  const wrap = document.getElementById('coursesWrap');
  wrap.innerHTML = loadingRow('Loading your courses…');
  try {
    const { courses } = await api('/user/courses');
    if (!courses.length) {
      wrap.innerHTML = `
        <div class="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          <div>You haven't been enrolled in a course yet.</div>
          <div class="page-sub" style="margin-top:4px">Once you're enrolled, it'll show up here.</div>
        </div>`;
      return;
    }
    wrap.innerHTML = `<div class="course-grid">${courses.map(courseCard).join('')}</div>`;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

function courseCard(c) {
  const thumb = c.thumbnail_url
    ? `<img src="${escapeHtml(c.thumbnail_url)}" alt="">`
    : bookIconSvg(34);
  return `
    <div class="course-card">
      <div class="course-thumb">${thumb}</div>
      <div class="course-body">
        <div class="course-title">${escapeHtml(c.title)}</div>
        <div class="course-desc">${escapeHtml(c.description || '')}</div>
        <a class="btn btn-primary btn-sm" href="/course.html?id=${c.id}">Continue</a>
      </div>
    </div>`;
}
</script>
</body>
</html>
